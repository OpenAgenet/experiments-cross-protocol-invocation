[package]
name = "oan-cross-protocol-experiment-tools"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
oan-core = { path = "../oan-protocol-common/crates/oan-core" }
oan-protocol = { path = "../oan-protocol-common/crates/oan-protocol" }
oan-client = { path = "../oan-protocol-common/crates/oan-client" }
